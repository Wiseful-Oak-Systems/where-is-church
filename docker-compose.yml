services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${DB_NAME:-whereischurch}
      POSTGRES_USER: ${DB_USER:-wic}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wic_dev_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wic} -d ${DB_NAME:-whereischurch}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-wic}
      DB_PASSWORD: ${DB_PASSWORD:-wic_dev_password}
      DB_NAME: ${DB_NAME:-whereischurch}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-string-of-at-least-32-characters}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      PORT: "8080"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_PATH: /app/uploads
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      AUTO_SEED: ${AUTO_SEED:-true}
      SEED_COUNTRY: ${SEED_COUNTRY:-BR}
    volumes:
      - uploads:/app/uploads
      - ./locales:/app/locales:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  pgdata:
  uploads:
