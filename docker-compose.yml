services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: whereischurch
      POSTGRES_USER: wic
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wic_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wic -d whereischurch"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
