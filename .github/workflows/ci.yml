name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  commit-lint:
    name: Commit Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Conventional Commits
        run: |
          commits=$(git log --format="%s" origin/main..HEAD)
          pattern="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?: .+"
          failed=0
          while IFS= read -r msg; do
            if [ -z "$msg" ]; then continue; fi
            if ! echo "$msg" | grep -qE "$pattern"; then
              echo "❌ $msg"
              failed=1
            else
              echo "✅ $msg"
            fi
          done <<< "$commits"
          if [ "$failed" -eq 1 ]; then
            echo ""
            echo "Some commits don't follow Conventional Commits format."
            echo "Expected: <type>(<scope>): <description>"
            echo "Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Run tests
        run: CGO_ENABLED=1 go test -race -coverprofile=coverage.out -covermode=atomic ./internal/...

      - name: Check coverage
        run: go tool cover -func=coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build server
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/whereischurch ./cmd/server

      - name: Build seed tool
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/seed ./cmd/seed

      - name: Build seedgen tool
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/seedgen ./cmd/seedgen

      - name: Build Docker image
        run: docker build -t where-is-church:test .
