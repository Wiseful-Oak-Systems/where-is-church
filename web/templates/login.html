<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login &mdash; Where is Church?</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="auth-page">

  <main class="auth-container">
    <div class="auth-card">
      <header class="auth-header">
        <span class="auth-icon" aria-hidden="true">&#9962;</span>
        <h1 class="auth-title">Where is Church?</h1>
        <p class="auth-subtitle">Sign in to find Mass near you</p>
      </header>

      <form id="login-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            placeholder="Your password"
            autocomplete="current-password"
            required
          >
        </div>

        <div id="login-error" class="form-error" role="alert" aria-live="polite" hidden></div>

        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
      </form>

      <footer class="auth-footer">
        <p>Don&rsquo;t have an account? <a href="/register" class="auth-link">Create one</a></p>
      </footer>
    </div>
  </main>

  <script>
    (function () {
      'use strict';

      var form  = document.getElementById('login-form');
      var errEl = document.getElementById('login-error');

      function showError(msg) {
        errEl.textContent = msg;
        errEl.hidden = false;
      }

      function clearError() {
        errEl.textContent = '';
        errEl.hidden = true;
      }

      function login(e) {
        e.preventDefault();
        clearError();

        var email    = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value;

        if (!email || !password) {
          showError('Please enter your email and password.');
          return;
        }

        var btn = form.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.textContent = 'Signing in\u2026';

        fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ email: email, password: password })
        })
          .then(function (res) {
            return res.json().then(function (data) {
              return { ok: res.ok, data: data };
            });
          })
          .then(function (result) {
            if (!result.ok) {
              throw new Error(result.data.error || 'Login failed. Please try again.');
            }
            window.location.href = '/';
          })
          .catch(function (err) {
            showError(err.message);
            btn.disabled = false;
            btn.textContent = 'Sign in';
          });
      }

      form.addEventListener('submit', login);
    })();
  </script>

</body>
</html>
