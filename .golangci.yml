run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - typecheck
    - bodyclose
    - noctx
    - gosec
    - goconst
    - misspell
    - unconvert
    - unparam

linters-settings:
  govet:
    check-shadowing: true
  gosec:
    excludes:
      - G104 # duplicate of errcheck
  goconst:
    min-len: 3
    min-occurrences: 3

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - noctx
        - errcheck
